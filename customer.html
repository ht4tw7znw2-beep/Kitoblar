function renderC(){document.body.className='cm';const m=$('#main');CATS=[...new Set(S.parts.map(p=>p.type))];
 if(ct==='cart'){m.innerHTML=cartV();walletLook()}else m.innerHTML=`<div class="ch"><div style="display:flex;gap:10px;align-items:center"><span class="logo" style="width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800">O</span><div><b>ORTIQ OPTIM</b><small>Telefon zapchastlari</small></div></div><span></span></div><div class="cs"><input placeholder="🔍 Model yoki zapchast qidiring" value="${esc(cq)}" oninput="cq=this.value;$('#cg').innerHTML=cgrid()"></div>`+(ct==='home'?'<div class="banner"><b>ortiq optim</b><h3>Telefon zapchastlari</h3><p>Original va sifatli ehtiyot qismlar · Buxoro</p></div>':'')+`<div class="chips"><button class="${!cat?'on':''}" onclick="setCat(-1)">Hammasi</button>${CATS.map((c,i)=>`<button class="${cat===c?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('')}</div><h2 style="padding:0 16px">${ct==='home'?'Mavjud mahsulotlar':'Katalog'}</h2><div class="pg" id="cg">${cgrid()}</div>`;
 drawCN()}
function drawCN(){const n=sum(cart,c=>c.qty);$('#cn').innerHTML=[['home','🏠','Bosh sahifa'],['cat','🗂','Katalog'],['cart','🛍','Savat']].map(([k,i,l])=>`<button class="${ct===k?'on':''}" onclick="ct='${k}';renderC()"><b>${i}${k==='cart'&&n?`<i>${n}</i>`:''}</b><span>${l}</span></button>`).join('')}
function addC(id){const c=cart.find(x=>x.pid===id),p=part(id);if(c){if(c.qty<p.qty)c.qty++}else cart.push({pid:id,qty:1});drawCN()}
function qC(id,d){const c=cart.find(x=>x.pid===id),p=part(id);c.qty=Math.min(p.qty,c.qty+d);if(c.qty<=0)cart=cart.filter(x=>x!==c);renderC()}
function cartV(){const it=cart.map(c=>({c,p:part(c.pid)})).filter(x=>x.p),t=sum(it,x=>x.c.qty*x.p.price);
 return `<div class="ch"><b>Savat</b></div>`+(it.map(({c,p})=>`<div class="ci"><div class="pi sm">${p.img?`<img src="${p.img}" alt="">`:`<span>${EMO[p.type]||'🧩'}</span>`}</div><div style="flex:1"><b>${esc(p.brand+' '+p.model)}</b><div class="k">${esc(p.type)} · ${fmt(p.price)}</div></div><div class="qt"><button onclick="qC('${p.id}',-1)">−</button><span>${c.qty}</span><button onclick="qC('${p.id}',1)">+</button></div></div>`).join('')||'<p class="k" style="padding:40px;text-align:center">Savat bo\'sh</p>')+(it.length?`<div class="cf"><input id="oc_n" placeholder="Ismingiz" value="${esc(NM)}" oninput="NM=this.value"><input id="oc_p" type="tel" placeholder="Telefon raqamingiz" style="margin-top:8px" value="${esc(PH)}" oninput="PH=this.value;walletLook()"><div class="paysel"><button class="${PAY==='Naqd'?'on':''}" onclick="setPay('Naqd')">Naqd</button><button class="${PAY==='Hamyon'?'on':''}" onclick="setPay('Hamyon')">Hamyon</button></div><p class="k" id="wl">${wlText(t)}</p><p><b>Jami: ${fmt(t)}</b></p><button class="btn" style="width:100%;padding:14px" onclick="order()">Buyurtma berish</button></div>`:'')}

async function order(){const n=$('#oc_n').value.trim(),ph=$('#oc_p').value.trim();if(!n||!ph){alert('Ism va telefonni kiriting');return}
 const items=cart.map(c=>{const p=part(c.pid);return{pid:c.pid,name:p.brand+' '+p.model+' '+p.type,qty:c.qty,price:p.price}});
 const tot=ctot(),use=PAY==='Hamyon'?Math.min(BAL,tot):0;if(PAY==='Hamyon'&&use<=0){alert("Hamyonda mablag' yo'q");return}
 const id=crypto.randomUUID();const {error}=await sb.from('orders').insert({id,name:n,phone:ph,items,pay:use>0?'Hamyon':'Naqd',wallet_use:use});
 if(error){alert("Xatolik. Qayta urinib ko'ring.");return}
 cart=[];ct='home';renderC();chek({title:'Buyurtma cheki',no:id.slice(0,6).toUpperCase(),date:new Date().toLocaleString('uz'),name:n,phone:ph,items,pay:use>0?'Hamyon '+fmt(use)+(tot>use?' + naqd '+fmt(tot-use):''):'Naqd',note:"Buyurtmangiz qabul qilindi. ~"+fmt(Math.round((tot-use)*0.01))+" ball hamyonga qaytadi."});PAY='Naqd'}
const SHOP={name:'ORTIQ OPTIM',sub:'Telefon zapchastlari',phone:'',addr:'Buxoro'};
function chek(d){const tot=d.items.reduce((a,i)=>a+i.qty*i.price,0)-(d.discount||0);
 window._ck=[SHOP.name,d.title+' № '+d.no,d.date,d.name?'Mijoz: '+d.name:'',...d.items.map(i=>i.name+' — '+i.qty+' × '+fmt(i.price)),'JAMI: '+fmt(tot),d.pay?"To'lov: "+d.pay:'',d.debt?'Qarz: '+fmt(d.debt):''].filter(Boolean).join('\n');
 let el=document.getElementById('chk');if(!el){el=document.createElement('div');el.id='chk';document.body.appendChild(el)}
 const L=(a,b)=>`<div class="mt"><span>${a}</span><span>${b}</span></div>`;
 el.innerHTML=`<div class="paper"><div class="ch1"><i class="mono">${esc(SHOP.name[0])}</i><b>${esc(SHOP.name)}</b><small>${esc(SHOP.sub)}</small>${SHOP.phone?`<small>📞 ${esc(SHOP.phone)}</small>`:''}${SHOP.addr?`<small>📍 ${esc(SHOP.addr)}</small>`:''}</div><div class="dash"></div>${L(esc(d.title),'<b>№ '+esc(d.no)+'</b>')}${L('Sana',esc(d.date))}${d.name?L('Mijoz',esc(d.name)):''}${d.phone?L('Tel',esc(d.phone)):''}<div class="dash"></div>${d.items.map(i=>`<div class="it">${esc(i.name)}${L(i.qty+' × '+fmt(i.price),'<b>'+fmt(i.qty*i.price)+'</b>')}</div>`).join('')}<div class="dash"></div>${d.discount?L('Chegirma','−'+fmt(d.discount)):''}<div class="mt tot"><span>JAMI</span><b>${fmt(tot)}</b></div>${d.pay?L("To'lov",esc(d.pay)):''}${d.debt?L('Qarz','<b>'+fmt(d.debt)+'</b>'):''}<div class="bar"></div><p class="ty">${esc(d.note||'Xaridingiz uchun rahmat!')}</p></div><div class="acts"><button class="btn" onclick="window.print()">🖨 Chop etish</button><button class="btn s" onclick="shareChek()">📤 Ulashish</button><button class="btn s" onclick="document.getElementById('chk').remove()">Yopish</button></div>`}
async function shareChek(){try{if(navigator.share)await navigator.share({text:window._ck});else{await navigator.clipboard.writeText(window._ck);alert('Chek matni nusxalandi')}}catch(e){}}

let NM='',PH='',PAY='Naqd',BAL=0;try{PH=localStorage.getItem('oo_ph')||''}catch(e){}
const ph9=t=>String(t||'').replace(/\D/g,'').slice(-9),ctot=()=>sum(cart,c=>c.qty*((part(c.pid)||{}).price||0));
function wlText(t){const u=Math.min(BAL,t);return PAY==='Hamyon'?(BAL>0?'Hamyondan '+fmt(u)+' yechiladi'+(t>u?', qolgani '+fmt(t-u)+' naqd':''):"Hamyonda mablag' yo'q"):'Har buyurtmadan 1% ball hamyonga qaytadi. Hamyon: '+fmt(BAL)}
function setPay(x){PAY=x;renderC()}
function walletLook(){const p=ph9(PH);if(p.length<9)return;try{localStorage.setItem('oo_ph',PH)}catch(e){}sb.rpc('get_balance',{p_phone:p}).then(r=>{BAL=+r.data||0;const e=$('#wl');if(e)e.textContent=wlText(ctot())})}
let vw='home',sb_='',sm_='',NAMES=[],MS=[],POP=[];
function brands(){const m={};S.parts.forEach(p=>{const b=p.brand||'Boshqa';(m[b]=m[b]||{n:0,models:{}}).n++;m[b].models[p.model]=(m[b].models[p.model]||0)+1});return m}
function pickB(i){sb_=NAMES[i];vw='brand';renderC()}
function pickM(i){sm_=MS[i][0];vw='model';renderC()}
function pickP(i){sb_=POP[i][0];sm_=POP[i][1];vw='model';renderC()}
function cardsOf(l){return l.map(p=>`<div class="pc"><div class="pi">${p.old?`<span class="bd d">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}${p.qty>0&&p.qty<=p.min?`<span class="bd">${p.qty} dona qoldi</span>`:''}${p.qty<=0?'<span class="bd r">Tugagan</span>':''}${p.img?`<img src="${p.img}" alt="">`:`<span>${EMO[p.type]||'🧩'}</span>`}</div><b>${esc(p.brand+' '+p.model)}</b><div class="k">${esc(p.type)}${p.quality?' · '+esc(p.quality):''}</div><div class="row"><b class="pr">${fmt(p.price)}${p.old?`<s class="old">${fmt(p.old)}</s>`:''}</b>${p.qty>0?`<button class="plus" onclick="addC('${p.id}')">+</button>`:''}</div></div>`).join('')}
function flow(){cat='';if(cq)return `<div class="pg" id="cg">${cgrid()}</div>`;
 const B=brands();NAMES=Object.keys(B).sort((a,b)=>B[b].n-B[a].n);
 if(!NAMES.length)return '<p class="k" style="padding:20px 16px">Hozircha mahsulot yo\'q</p>';
 if(vw==='brand'&&B[sb_]){MS=Object.entries(B[sb_].models);return `<button class="back" onclick="vw='home';renderC()">‹ Orqaga</button><h2 class="ti2">${esc(sb_)}</h2>`+MS.map(([k,n],i)=>`<button class="mrow" onclick="pickM(${i})"><span>${esc(k)}</span><small>${n} ta zapchast ›</small></button>`).join('')}
 if(vw==='model')return `<button class="back" onclick="vw='brand';renderC()">‹ ${esc(sb_)}</button><h2 class="ti2">${esc(sm_)}</h2><div class="pg" id="cg">${cardsOf(S.parts.filter(p=>p.model===sm_))}</div>`;
 POP=[];S.parts.forEach(p=>{if(!POP.some(x=>x[1]===p.model))POP.push([p.brand,p.model])});POP=POP.slice(0,8);
 return `<div class="hero2"><div class="sf">Buxoro Optim Zapchastlar</div><p>Sifatli zapchast, halol narx</p></div><h1 class="q">Telefoningiz qaysi?</h1><div class="bg2">${NAMES.map((b,i)=>`<button class="bt${i===0?' f':''}" onclick="pickB(${i})"><i>▣</i><b>${esc(b)}</b><small>${B[b].n} ta zapchast</small></button>`).join('')}</div><div class="h3">Mashhur zapchastlar</div><div class="pg">${cardsOf(S.parts.filter(p=>p.qty>0).slice(0,4))}</div>`}
renderC=function(){document.body.className='cm';const m=$('#main');CATS=[...new Set(S.parts.map(p=>p.type))];
 const sbar=h=>`<div class="cs"><input placeholder="Model yoki zapchast qidiring" value="${esc(cq)}" oninput="cq=this.value;${h}"></div>`;
 if(ct==='cart')m.innerHTML=cartV();
 else if(ct==='cat')m.innerHTML=sbar("$('#cg').innerHTML=cgrid()")+`<div class="chips"><button class="${!cat?'on':''}" onclick="setCat(-1)">Hammasi</button>${CATS.map((c,i)=>`<button class="${cat===c?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('')}</div><div class="pg" id="cg">${cgrid()}</div>`;
 else m.innerHTML=sbar("$('#bd').innerHTML=flow()")+'<div id="bd">'+flow()+'</div>';
 drawCN()}
async function load(){const {data}=await sb.from('catalog').select('*').order('brand');S.parts=data||[];renderC()}
load();setInterval(()=>{const a=document.activeElement;if(!a||a.tagName!=='INPUT')load()},60000);
</script></body></html>
