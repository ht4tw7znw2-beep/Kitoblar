<!DOCTYPE html>

label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
@media(min-width:760px){#modal{align-items:center}#box{border-radius:18px}}
@media(max-width:759px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--b);border-right:0;z-index:5}nav h1{display:none}nav button{width:auto;white-space:nowrap;padding:8px 12px}main{padding-bottom:90px}}
:root{--sh:0 1px 2px #1b1f3b0f,0 8px 24px #1b1f3b0d;--gr:linear-gradient(135deg,#4f46e5,#7c3aed)}
body{background:radial-gradient(900px 400px at 85% -10%,#7c3aed1f,transparent),var(--bg);background-attachment:fixed;letter-spacing:.005em}

nav button.on{background:var(--gr);color:#fff;box-shadow:0 6px 16px #4f46e555}
main{padding:22px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;padding:6px 0 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.top input{padding:13px 16px;border-radius:14px;box-shadow:var(--sh);border-color:transparent}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:0}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.card{border-radius:18px;box-shadow:var(--sh);border-color:transparent}
.kpi{display:flex;align-items:center;gap:12px;transition:.15s}.kpi:hover{transform:translateY(-2px)}

tr:hover td{background:#4f46e50a}th{text-transform:uppercase;letter-spacing:.05em;font-size:11px}td{vertical-align:middle}
.tag{font-weight:600;padding:3px 10px}
button.btn{background:var(--gr);box-shadow:0 4px 12px #4f46e544;font-weight:600;transition:.15s}button.btn:active{transform:scale(.97)}
button.btn.s{background:var(--c);box-shadow:none;font-weight:500}button.btn.d{background:var(--r)}
.bars{height:160px;gap:10px}.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{background:linear-gradient(180deg,#7c3aed,#4f46e5);border-radius:8px 8px 3px 3px;margin:3px 0}.bars em{font-style:normal;font-size:10px;color:var(--t);font-weight:600}
#modal{backdrop-filter:blur(4px);background:#0a0c1c88}#box{animation:up .22s ease;box-shadow:0 -10px 40px #0004}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(max-width:759px){main{padding:14px 14px 96px}nav{justify-content:space-around;gap:0;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 -6px 24px #0001}
nav button{flex-direction:column;gap:1px;font-size:10px;padding:6px 8px;min-width:58px;text-align:center}nav button b{font-size:20px}nav button.on{box-shadow:none;border-radius:12px}h2{font-size:19px}}

:root{--p:#1fb855;--gr:linear-gradient(135deg,#22c55e,#16a34a);--bg:#f6f7f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#34d27b;--bg:#0e1511}}
:root[data-theme="dark"]{--p:#34d27b;--bg:#0e1511}
body{background:var(--bg)}
.logo,nav button.on,button.btn{box-shadow:0 6px 16px #16a34a44}
.kpi .ic,.kpi:nth-child(2n) .ic{background:#1fb8551a}.kpi:nth-child(3n) .ic{background:#f973161f}
.bars i{background:linear-gradient(180deg,#34d27b,#16a34a)}
tr:hover td{background:#1fb8550d}
.top input{border-radius:99px;border:1.5px solid var(--b);box-shadow:none}
.cm #app{display:block}.cm nav{display:none}.cm main{max-width:520px;margin:0 auto;padding:0 0 100px}.cm .top{display:none}
#cn{display:none}.cm #cn{display:flex;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#cn button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#cn button b{font-size:22px;font-weight:400;position:relative;filter:grayscale(1);opacity:.7}
#cn button.on{color:var(--p);font-weight:600}#cn button.on b{filter:none;opacity:1}
#cn b i{position:absolute;top:-4px;right:-12px;background:var(--p);color:#fff;font:600 11px/1 system-ui;border-radius:99px;padding:3px 6px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}.ch small{display:block;color:var(--m);font-size:12px}.ch b{font-size:20px}
.cs{padding:4px 16px 12px}.cs input{border-radius:99px;padding:13px 18px;border:1.5px solid var(--b)}
.banner{margin:4px 16px 14px;padding:22px;border-radius:22px;color:#fff;background:radial-gradient(circle at 90% 15%,#ffffff40,transparent 45%),linear-gradient(135deg,#00c800,#0a8f2a)}
.banner b{font-size:30px;font-weight:800;letter-spacing:-.02em}.banner h3{margin:6px 0 4px;font-size:22px}.banner p{margin:0;opacity:.92;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px}.chips button{flex:none;border:0;background:#1fb8551a;color:var(--t);padding:9px 16px;border-radius:14px;font:inherit;font-size:14px;cursor:pointer}.chips button.on{background:var(--p);color:#fff}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.pc{background:var(--c);border-radius:18px;padding:10px;box-shadow:var(--sh)}.pc>b{display:block;margin-top:8px;font-size:14px}
.pi{height:120px;border-radius:14px;background:linear-gradient(135deg,#1fb85522,var(--bg));display:grid;place-items:center;font-size:46px;position:relative}.pi.sm{width:60px;height:60px;font-size:28px;flex:none}
.bd{position:absolute;top:6px;left:6px;background:#f97316;color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}.bd.r{background:var(--r)}
.pc .row{justify-content:space-between;margin:8px 0 0}.pc .row>*{flex:none}.pr{color:var(--p)}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:20px;cursor:pointer}
.ci{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b)}.qt{display:flex;align-items:center;gap:8px}.qt button{width:30px;height:30px;border-radius:50%;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:16px;cursor:pointer}.cf{padding:16px}
</style></head>
<body class="cm"><div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="cn"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://kwpxfjpnqpyvvnnbuoau.supabase.co',SUPA_KEY='sb_publishable_WwD93uvxmsD9Mwm-7Ues4w_40ox8u-q';
if(SUPA_URL.startsWith('PASTE')){document.body.className='';document.body.innerHTML='<div style="font:16px/1.5 system-ui;padding:28px">⚙️ Sozlanmagan.<br>Fayl boshidagi SUPA_URL va SUPA_KEY ni Supabase ma\'lumotlari bilan almashtiring.</div>';throw new Error('not configured')}
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const S={parts:[]};
const $=q=>document.querySelector(q),part=id=>S.parts.find(p=>p.id===id),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n)||0).toLocaleString('en-US').replace(/,/g,' ')+" so'm";
let ct='home',cq='',cat='',cart=[],CATS=[];
const EMO={'Displey':'📱','Batareya':'🔋','Kamera':'📷','Kamera oynasi':'🔍','Dinamik':'🔊','Mikrofon':'🎙',"Zaryad raz'yomi":'🔌','Orqa qopqoq':'📲','Korpus':'📲'};
function cgrid(){const q2=cq.toLowerCase();const l=S.parts.filter(p=>(!cat||p.type===cat)&&(!q2||(p.brand+' '+p.name+' '+p.code).toLowerCase().includes(q2)));
 return l.map(p=>`<div class="pc"><div class="pi">${p.qty>0&&p.qty<=p.min?`<span class="bd">${p.qty} dona qoldi</span>`:''}${p.qty<=0?'<span class="bd r">Tugagan</span>':''}<span>${EMO[p.type]||'🧩'}</span></div><b>${esc(p.brand+' '+p.model)}</b><div class="k">${esc(p.type)}${p.quality?' · '+esc(p.quality):''}</div><div class="row"><b class="pr">${fmt(p.price)}</b>${p.qty>0?`<button class="plus" onclick="addC('${p.id}')">+</button>`:''}</div></div>`).join('')||'<p class="k" style="padding:20px;grid-column:1/-1">Mahsulot topilmadi</p>'}
function setCat(i){cat=i<0?'':CATS[i];renderC()}
function renderC(){document.body.className='cm';const m=$('#main');CATS=[...new Set(S.parts.map(p=>p.type))];
 if(ct==='cart')m.innerHTML=cartV();else m.innerHTML=`<div class="ch"><div><small>Filial</small><b>AROS Buxoro ⌄</b></div><span></span></div><div class="cs"><input placeholder="🔍 Model yoki zapchast qidiring" value="${esc(cq)}" oninput="cq=this.value;$('#cg').innerHTML=cgrid()"></div>`+(ct==='home'?'<div class="banner"><b>aros</b><h3>Telefon zapchastlari</h3><p>Original va sifatli ehtiyot qismlar · Buxoro</p></div>':'')+`<div class="chips"><button class="${!cat?'on':''}" onclick="setCat(-1)">Hammasi</button>${CATS.map((c,i)=>`<button class="${cat===c?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('')}</div><h2 style="padding:0 16px">${ct==='home'?'Mavjud mahsulotlar':'Katalog'}</h2><div class="pg" id="cg">${cgrid()}</div>`;
 drawCN()}
function drawCN(){const n=sum(cart,c=>c.qty);$('#cn').innerHTML=[['home','🏠','Bosh sahifa'],['cat','🗂','Katalog'],['cart','🛍','Savat']].map(([k,i,l])=>`<button class="${ct===k?'on':''}" onclick="ct='${k}';renderC()"><b>${i}${k==='cart'&&n?`<i>${n}</i>`:''}</b><span>${l}</span></button>`).join('')}
function addC(id){const c=cart.find(x=>x.pid===id),p=part(id);if(c){if(c.qty<p.qty)c.qty++}else cart.push({pid:id,qty:1});drawCN()}
function qC(id,d){const c=cart.find(x=>x.pid===id),p=part(id);c.qty=Math.min(p.qty,c.qty+d);if(c.qty<=0)cart=cart.filter(x=>x!==c);renderC()}
function cartV(){const it=cart.map(c=>({c,p:part(c.pid)})).filter(x=>x.p),t=sum(it,x=>x.c.qty*x.p.price);
 return `<div class="ch"><b>Savat</b></div>`+(it.map(({c,p})=>`<div class="ci"><div class="pi sm"><span>${EMO[p.type]||'🧩'}</span></div><div style="flex:1"><b>${esc(p.brand+' '+p.model)}</b><div class="k">${esc(p.type)} · ${fmt(p.price)}</div></div><div class="qt"><button onclick="qC('${p.id}',-1)">−</button><span>${c.qty}</span><button onclick="qC('${p.id}',1)">+</button></div></div>`).join('')||'<p class="k" style="padding:40px;text-align:center">Savat bo\'sh</p>')+(it.length?`<div class="cf"><input id="oc_n" placeholder="Ismingiz"><input id="oc_p" type="tel" placeholder="Telefon raqamingiz" style="margin-top:8px"><p><b>Jami: ${fmt(t)}</b></p><button class="btn" style="width:100%;padding:14px" onclick="order()">Buyurtma berish</button></div>`:'')}

async function order(){const n=$('#oc_n').value.trim(),ph=$('#oc_p').value.trim();if(!n||!ph){alert('Ism va telefonni kiriting');return}
 const items=cart.map(c=>{const p=part(c.pid);return{pid:c.pid,name:p.brand+' '+p.model+' '+p.type,qty:c.qty,price:p.price}});
 const {error}=await sb.from('orders').insert({name:n,phone:ph,items});
 if(error){alert("Xatolik. Qayta urinib ko'ring.");return}
 cart=[];ct='home';renderC();alert("Buyurtma qabul qilindi! Tez orada bog'lanamiz.")}
async function load(){const {data}=await sb.from('catalog').select('*').order('brand');S.parts=data||[];renderC()}
load();setInterval(()=>{const a=document.activeElement;if(!a||a.tagName!=='INPUT')load()},60000);
</script></body></html>
