 const days=[...Array(7)].map((_,i)=>{const d=f2(new Date(Date.now()-(6-i)*864e5));return[d.slice(5),sum(S.sales.filter(s=>s.date===d),total)]});const mx=Math.max(1,...days.map(d=>d[1]));

function hisobot(){const fr=range(),ss=S.sales.filter(s=>inRange(s.date,fr)),ex=S.expenses.filter(e=>inRange(e.date,fr));const gp=sum(ss,profit),exs=sum(ex,e=>e.amt);

 <div class="card"><div class="row"><span>Jami savdo</span><b>${fmt(sum(ss,total))}</b></div><div class="row"><span>Mahsulotlar</span><b>${sum(ss,s=>sum(s.items,i=>i.qty))} dona</b></div><div class="row"><span>Mijozlar</span><b>${new Set(ss.map(s=>s.custId)).size} ta</b></div><div class="row"><span>Xarajat</span><b>${fmt(exs)}</b></div><div class="row"><span>Foyda (savdodan)</span><b>${fmt(gp)}</b></div><div class="row"><span>Sof foyda (− xarajat)</span><b>${fmt(gp-exs)}</b></div></div>

 <div class="row" style="margin-top:12px"><button class="btn s" onclick="backup()">💾 Zaxira nusxa (JSON)</button><button class="btn s" onclick="restoreB()">♻️ Tiklash</button></div><p class="k">Ma'lumotlar shu brauzerda saqlanadi. Muntazam zaxira oling.</p>`}
async function dl(name,data){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}catch(e){alert('Yuklab olish bu muhitda mavjud emas')}}
function exportCsv(){const r=[['Sana','Mijoz','Mahsulot','Soni','Summa','Foyda','Tolov']];S.sales.filter(s=>inRange(s.date,range())).forEach(s=>r.push([s.date,(cust(s.custId)||{}).name||'',s.items.map(i=>i.name+' x'+i.qty).join('; '),sum(s.items,i=>i.qty),total(s),profit(s),s.pay]));

function wav(){const sr=22050,seq=[[880,0],[1175,.22],[880,.5],[1175,.72],[1480,1]],len=Math.floor(sr*1.35),d=new Int16Array(len);seq.forEach(([f,t])=>{const st=Math.floor(t*sr),n=Math.floor(.28*sr);for(let i=0;i<n&&st+i<len;i++){const e=Math.min(1,i/(.02*sr))*Math.exp(-3*i/n);d[st+i]+=Math.sin(2*Math.PI*f*i/sr)*e*20000}});
 const b=new ArrayBuffer(44+len*2),v=new DataView(b),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);d.forEach((x,i)=>v.setInt16(44+i*2,x,true));return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
