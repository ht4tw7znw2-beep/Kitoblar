 for(const l of ls){const p=part(l.pid);if(p.qty<l.qty){alert(p.name+": omborda yetarli emas ("+p.qty+")");return}}
 let cid=tmp.cust;if(!cid&&tmp.newc){cid=uid();S.customers.push({id:cid,name:tmp.newc,phone:tmp.newp||'',tg:'',note:''})}
 const s={id:uid(),date:today(),custId:cid||'',pay:tmp.pay||'Naqd',discount:+tmp.disc||0,note:tmp.note||'',due:tmp.due||'',items:ls.map(l=>{const p=part(l.pid);p.qty-=l.qty;return{pid:p.id,name:p.brand+' '+p.name,qty:l.qty,price:l.price,cost:p.cost}}),payments:[]};
 const t=total(s);const pd=tmp.paid===''||tmp.paid===undefined?t:Math.min(+tmp.paid||0,t);if(pd>0)s.payments.push({date:today(),amt:pd});
 S.sales.push(s);S.log.push({t:new Date().toISOString(),a:'sotuv',id:s.id});tmp={};save();close_();tab='savdo';render()}

let rp='Kunlik';
function range(){const t=today();return rp==='Kunlik'?t:rp==='Haftalik'?wk():rp==='Oylik'?mon():t.slice(0,4)+'-01-01'}
function hisobot(){const fr=range(),ss=S.sales.filter(s=>inRange(s.date,fr)),ex=S.expenses.filter(e=>inRange(e.date,fr));const gp=sum(ss,profit),exs=sum(ex,e=>e.amt);
 const byM={};ss.forEach(s=>s.items.forEach(i=>byM[i.name]=(byM[i.name]||0)+i.qty*i.price));
 return `<h2>Hisobot</h2><div class="row"><select onchange="rp=this.value;rer()">${['Kunlik','Haftalik','Oylik','Yillik'].map(x=>`<option ${x===rp?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="exportCsv()">⬇ CSV (Excel)</button></div>
 <div class="card"><div class="row"><span>Jami savdo</span><b>${fmt(sum(ss,total))}</b></div><div class="row"><span>Mahsulotlar</span><b>${sum(ss,s=>sum(s.items,i=>i.qty))} dona</b></div><div class="row"><span>Mijozlar</span><b>${new Set(ss.map(s=>s.custId)).size} ta</b></div><div class="row"><span>Xarajat</span><b>${fmt(exs)}</b></div><div class="row"><span>Foyda (savdodan)</span><b>${fmt(gp)}</b></div><div class="row"><span>Sof foyda (− xarajat)</span><b>${fmt(gp-exs)}</b></div></div>
 <div class="card" style="margin-top:12px"><b>Mahsulot bo'yicha</b>${Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span>${esc(x[0])}</span><span style="text-align:right">${fmt(x[1])}</span></div>`).join('')||'<p class="k">Ma\'lumot yo\'q</p>'}</div>
 <div class="row" style="margin-top:12px"><button class="btn s" onclick="backup()">💾 Zaxira nusxa (JSON)</button><button class="btn s" onclick="restoreB()">♻️ Tiklash</button></div><p class="k">Ma'lumotlar shu brauzerda saqlanadi. Muntazam zaxira oling.</p>`}
async function dl(name,data){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}

 dl('hisobot-'+today()+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))}

 drawCN()}

 let c=S.customers.find(x=>x.phone===o.phone);if(!c){c={id:uid(),name:o.name,phone:o.phone,tg:'',note:'Buyurtma orqali'};S.customers.push(c)}
 const s={id:uid(),date:today(),custId:c.id,pay:'Naqd',discount:0,note:'Mijoz buyurtmasi',due:'',items:its.map(i=>{const p=part(i.pid);p.qty-=i.qty;return{pid:p.id,name:p.brand+' '+p.name,qty:i.qty,price:p.price,cost:p.cost}}),payments:[]};
 s.payments.push({date:today(),amt:total(s)});S.sales.push(s);S.log.push({t:new Date().toISOString(),a:'buyurtma->sotuv',id:s.id});o.st='tasdiqlandi';save();rer()}

let ctx=null,tmr=null,ready=false;
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();[0,.3,.6].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+t;o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.35,n);g.gain.exponentialRampToValueAtTime(.001,n+.22);o.start(n);o.stop(n+.25)})}catch(e){}}
function note(o){const d=document.createElement('div');d.textContent='🔔 Yangi buyurtma: '+o.name;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 18px;border-radius:14px;z-index:40;box-shadow:0 8px 24px #0004';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
